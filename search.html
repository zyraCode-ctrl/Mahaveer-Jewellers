<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Mahaveer Jewellers</title>
  <link rel="icon" type="image/png" href="images/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="images/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="search">
  <div id="site-header"></div>
  <main class="container page">
    <form class="search search-page-form" role="search" action="listing.html">
      <button class="search-icon" aria-label="Search">&#9906;</button>
      <label class="search-label">
        <input type="text" name="q" aria-label="Search jewellery" placeholder="Search by name, type or item number" autocomplete="off">
      </label>
      <ul class="search-suggest" hidden></ul>
    </form>
    <h2 class="page-subtitle">Trending Searches</h2>
    <div class="trending quick-filters left"></div>
    <h2 class="page-subtitle">Shop By Category</h2>
    <div class="cat-grid search-cats"></div>
    <div class="recent-block" hidden>
      <h2 class="page-subtitle">Recently Viewed</h2>
      <div class="rail recent-rail"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/icons.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>

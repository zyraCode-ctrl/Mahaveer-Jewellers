<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Mahaveer Jewellers</title>
  <link rel="icon" href="images/brand/mark-gold.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main class="container page">
    <div class="plp-head">
      <ol class="breadcrumb"><li><a href="index.html">Home</a></li><li aria-current="page">Contact Us</li></ol>
      <p class="kicker">We're here to help</p>
      <h1>Contact Us</h1>
    </div>
    <div class="contact-grid">
      <div class="card contact-card">
        <a class="contact-line" data-href="whatsapp" href="#"><span data-icon="whatsapp" data-size="22"></span><span><b>WhatsApp</b><small>Fastest replies, photos &amp; video calls</small></span></a>
        <a class="contact-line" data-href="phone" href="#"><span data-icon="phone" data-size="22"></span><span><b data-brand="phone"></b><small>Showroom hours, all days</small></span></a>
        <a class="contact-line" data-href="email" href="#"><span data-icon="mail" data-size="22"></span><span><b data-brand="email"></b><small>We reply within one working day</small></span></a>
        <a class="contact-line" data-href="map" href="#"><span data-icon="pin" data-size="22"></span><span><b>Visit the showroom</b><small data-brand="address"></small></span></a>
        <img class="contact-photo" src="images/showroom/team-counter.jpg" alt="Mahaveer Jewellers consultants" loading="lazy">
      </div>
      <form class="card contact-form">
        <h2>Send us a message</h2>
        <label>Name<input required></label>
        <label>Email<input type="email" required></label>
        <label>Mobile<input type="tel" pattern="\d{10}"></label>
        <label>I'm interested in
          <select><option>General enquiry</option><option>Bridal consultation</option><option>Showroom appointment</option><option>Custom design</option><option>Old gold exchange</option><option>Order support</option></select>
        </label>
        <label>Message<textarea rows="4" required></textarea></label>
        <button class="btn-primary block">Send Message</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/icons.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>

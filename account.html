<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Mahaveer Jewellers</title>
  <link rel="icon" type="image/png" href="images/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="images/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="account">
  <div id="site-header"></div>
  <main class="container page">
    <div class="plp-head">
      <h1>My Account</h1>
      <ol class="breadcrumb"><li><a href="index.html">Home</a></li><li aria-current="page">Account</li></ol>
    </div>
    <div class="account-grid">
      <div class="card">
        <p class="label">PROFILE</p>
        <h2 class="account-name"></h2>
        <p class="muted account-contact"></p>
        <button class="outline-btn logout">Logout</button>
      </div>
      <a class="card account-tile" href="cart.html"><b class="stat-bag">0</b><span>Items in Bag</span></a>
      <a class="card account-tile" href="wishlist.html"><b class="stat-wish">0</b><span>Wishlist</span></a>
      <div class="card">
        <p class="label">MY ORDERS</p>
        <p class="muted">No orders yet.</p>
        <a class="link" href="info.html?page=track">Track an order</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/icons.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
